<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faqe web 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section id="welcome">
            <h1>Vëmendje familiarët e mi !</h1>

            <p>Kam një lajm të rëndësishëm.</p>

            <button id="startButton">
                Klikoni këtu
            </button>
        </section>

        <section id="birthday" class="hidden">

            <h1> SURPRIZË! 🎉</h1>

            <div id="confettiContainer"></div>

            <h2>Numërimi mbrapsht i ditëlindjes time!! 🎂</h2>

            <div id="countdown">
                <div>
                    <span id="days">0</span>
                    <p>Days</p>
                </div>

                <div>
                    <span id="hours">0</span>
                    <p>Hours</p>
                </div>

                <div>
                    <span id="minutes">0</span>
                    <p>Minutes</p>
                </div>

                <div>
                    <span id="seconds">0</span>
                    <p>Seconds</p>
                </div>
            </div>

            <p class="message">
                Nëse keni klikuar duhet ta dini që e kam ditëlindjen...
            </p>

            <h2>Ju që klikuat më keni 2 euro borxh! 💸</h2>


        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
